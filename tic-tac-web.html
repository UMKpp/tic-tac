<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XOX (Tic Tac Toe) Game</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            margin: 20px auto;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 15px;
        }
        
        .cell {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 10px;
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .cell:hover {
            background: rgba(255, 255, 255, 1);
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .cell:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        
        .cell.x {
            color: #e74c3c;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .cell.o {
            color: #3498db;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .game-info {
            margin: 20px 0;
            font-size: 1.3em;
        }
        
        .current-player {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 25px;
            display: inline-block;
            margin: 10px;
        }
        
        .winner-message {
            font-size: 1.5em;
            margin: 20px 0;
            padding: 15px;
            background: rgba(46, 204, 113, 0.3);
            border-radius: 15px;
            animation: pulse 2s infinite;
        }
        
        .draw-message {
            font-size: 1.5em;
            margin: 20px 0;
            padding: 15px;
            background: rgba(241, 196, 15, 0.3);
            border-radius: 15px;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .reset-btn {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        
        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1> XOX Game</h1>
        
        <div class="game-info">
            <div class="current-player" id="currentPlayer">Current Player: X</div>
        </div>
        
        <div class="game-board" id="gameBoard">
            <!-- Cells will be generated by JavaScript -->
        </div>
        
        <div id="gameMessage"></div>
        
        <button class="reset-btn" onclick="resetGame()">🔄 New Game</button>
    </div>

    <script>
        let board = [
            [" ", " ", " "],
            [" ", " ", " "],
            [" ", " ", " "]
        ];
        let currentPlayer = "X";
        let gameActive = true;

        function initializeBoard() {
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';
            
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    const cell = document.createElement('button');
                    cell.className = 'cell';
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    cell.onclick = () => makeMove(i, j, cell);
                    gameBoard.appendChild(cell);
                }
            }
        }

        function makeMove(row, col, cellElement) {
            if (!gameActive || board[row][col] !== " ") {
                return;
            }

            // make the move
            board[row][col] = currentPlayer;
            cellElement.textContent = currentPlayer;
            cellElement.classList.add(currentPlayer.toLowerCase());
            cellElement.disabled = true;

            // check winner
            if (checkWinner(board, currentPlayer)) {
                document.getElementById('gameMessage').innerHTML = 
                    `<div class="winner-message">🎉 Player ${currentPlayer} wins!</div>`;
                gameActive = false;
                disableAllCells();
                return;
            }

            // check draw
            if (isDraw(board)) {
                document.getElementById('gameMessage').innerHTML = 
                    `<div class="draw-message">🤝 It's a draw!</div>`;
                gameActive = false;
                return;
            }

            // switch the player
            currentPlayer = currentPlayer === "X" ? "O" : "X";
            document.getElementById('currentPlayer').textContent = `Current Player: ${currentPlayer}`;
        }

        function checkWinner(board, player) {
            // check rows
            for (let i = 0; i < 3; i++) {
                if (board[i].every(cell => cell === player)) {
                    return true;
                }
            }

            // check columns
            for (let i = 0; i < 3; i++) {
                if (board.every(row => row[i] === player)) {
                    return true;
                }
            }

            // check diagonals
            if (board[0][0] === player && board[1][1] === player && board[2][2] === player) {
                return true;
            }
            if (board[0][2] === player && board[1][1] === player && board[2][0] === player) {
                return true;
            }

            return false;
        }

        function isDraw(board) {
            return board.every(row => row.every(cell => cell !== " "));
        }

        function disableAllCells() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => cell.disabled = true);
        }

        function resetGame() {
            board = [
                [" ", " ", " "],
                [" ", " ", " "],
                [" ", " ", " "]
            ];
            currentPlayer = "X";
            gameActive = true;
            
            document.getElementById('currentPlayer').textContent = `Current Player: ${currentPlayer}`;
            document.getElementById('gameMessage').innerHTML = '';
            
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.textContent = '';
                cell.className = 'cell';
                cell.disabled = false;
            });
        }

        initializeBoard();
    </script>
</body>
</html>
