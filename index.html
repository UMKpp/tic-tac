<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XOX (Tic Tac Toe) Game</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="game-container">
        <h1>XOX Game</h1>

        <div id="gameModeSelection" class="game-mode-selection">
            <h2>Choose Game Mode</h2>
            <button class="mode-btn" onclick="startGame('human')">Play with Friend</button>
            <button class="mode-btn" onclick="startGame('computer')">Play with Computer</button>
        </div>

        <div id="gameInterface" class="game-interface hidden">
            <div class="game-info">
                <div class="current-player" id="currentPlayer">Current Player: X</div>
                <div id="gameMode" class="game-mode-display">Mode: -</div>
                <div id="levelDisplay" class="game-mode-display">Level: 1</div>

                <div class="scoreboard">
                    <p>Player X: <span id="playerXScore">0</span></p>
                    <p>Player O: <span id="playerOScore">0</span></p>
                    <p>Draws: <span id="draws">0</span></p>
                </div>
            </div>

            <div class="game-board" id="gameBoard"></div>

            <div id="gameMessage"></div>

            <div class="game-controls" id="gameControls">
                <button class="reset-btn action-btn" onclick="resetGame()">New Game</button>
                <button class="mode-btn action-btn" onclick="backToModeSelection()">Home</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
