<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XOX (Tic Tac Toe) Game</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f8f9fa;
            color: #212529;
        }

        .game-container {
            text-align: center;
            background: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 500px;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            margin: 20px auto;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 15px;
            justify-self: center;
            width: fit-content;
        }

        .cell {
            background: #e9ecef;
            border: none;
            border-radius: 10px;
            font-size: 2.5em;
            font-weight: bold;
            color: #495057;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell:hover {
            background: #dee2e6;
            box-shadow: none;
        }

        .cell:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .cell.x {
            color: black;
        }

        .cell.o {
            color: black;
        }

        .game-info {
            margin: 20px 0;
            font-size: 1.3em;
        }

        .current-player {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 25px;
            display: inline-block;
            margin: 10px;
        }

        .winner-message {
            font-size: 1.5em;
            margin: 20px 0;
            padding: 15px;
            background: #d0d0d0;
            border-radius: 15px;
        }

        .draw-message {
            font-size: 1.5em;
            margin: 20px 0;
            padding: 15px;
            background: #d0d0d0;
        }

        .reset-btn {
            background: #6c757d;
            color: #ffffff;
            border: none;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .reset-btn:hover {
            background: #5a6268;
            box-shadow: none;
        }

        .game-mode-selection {
            text-align: center;
            margin: 20px 0;
        }

        .game-mode-selection h2 {
            margin-bottom: 30px;
            font-size: 1.8em;
        }

        .mode-btn {
            background: #007bff;
            color: #ffffff;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            min-width: 200px;
        }

        .mode-btn:hover {
            background: #0056b3;
            box-shadow: none;
        }

        .game-mode-display {
            background: #e0e0e0;
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            margin: 5px;
            font-size: 0.9em;
        }

        .game-controls {
            margin-top: 20px;
        }

        .computer-thinking {
            background: #d0d0d0;
            padding: 10px 20px;
            border-radius: 15px;
            margin: 10px 0;
            animation: pulse 1s infinite;
        }
    </style>
</head>

<body>
    <div class="game-container">
        <h1>XOX Game</h1>


        <div id="gameModeSelection" class="game-mode-selection">
            <h2>Choose Game Mode</h2>
            <button class="mode-btn" onclick="startGame('human')">Play with Friend</button>
            <button class="mode-btn" onclick="startGame('computer')">Play with Computer</button>
        </div>


        <div id="gameInterface" class="game-interface" style="display: none;">
            <div class="game-info">
                <div class="current-player" id="currentPlayer">Current Player: X</div>
                <div id="gameMode" class="game-mode-display"></div>
            </div>

            <div class="game-board" id="gameBoard">

            </div>

            <div id="gameMessage"></div>

            <div class="game-controls">
                <button class="reset-btn" onclick="resetGame()">🔄 New Game</button>
                <button class="mode-btn" onclick="backToModeSelection()">🏠 Back to Menu</button>
            </div>
        </div>
    </div>

    <script>
        let board = [
            [" ", " ", " "],
            [" ", " ", " "],
            [" ", " ", " "]
        ];
        let currentPlayer = "X";
        let gameActive = true;
        let gameMode = ""; // player 2 or pc
        let isComputerTurn = false;

        function startGame(mode) {
            gameMode = mode;
            document.getElementById('gameModeSelection').style.display = 'none';
            document.getElementById('gameInterface').style.display = 'block';


            const modeText = mode === 'human' ? '👥 Two Players' : '🤖 vs Computer';
            document.getElementById('gameMode').textContent = modeText;

            resetGame();
            initializeBoard();
        }

        function backToModeSelection() {
            document.getElementById('gameModeSelection').style.display = 'block';
            document.getElementById('gameInterface').style.display = 'none';
            gameMode = "";
        }

        function initializeBoard() {
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';

            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    const cell = document.createElement('button');
                    cell.className = 'cell';
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    cell.onclick = () => makeMove(i, j, cell);
                    gameBoard.appendChild(cell);
                }
            }
        }

        function makeMove(row, col, cellElement) {
            if (!gameActive || board[row][col] !== " " || isComputerTurn) {
                return;
            }


            board[row][col] = currentPlayer;
            cellElement.textContent = currentPlayer;
            cellElement.classList.add(currentPlayer.toLowerCase());
            cellElement.disabled = true;


            if (checkWinner(board, currentPlayer)) {
                let winnerText = currentPlayer;
                if (gameMode === 'computer') {
                    winnerText = currentPlayer === 'X' ? 'You' : 'Computer';
                }
                document.getElementById('gameMessage').innerHTML =
                    `<div class="winner-message">🎉 ${winnerText} wins!</div>`;
                gameActive = false;
                disableAllCells();
                return;
            }


            if (isDraw(board)) {
                document.getElementById('gameMessage').innerHTML =
                    `<div class="draw-message">🤝 It's a draw!</div>`;
                gameActive = false;
                return;
            }


            currentPlayer = currentPlayer === "X" ? "O" : "X";
            updateCurrentPlayerDisplay();


            if (gameMode === 'computer' && currentPlayer === 'O') {
                setTimeout(makeComputerMove, 500);
            }
        }

        function updateCurrentPlayerDisplay() {
            let playerText = currentPlayer;
            if (gameMode === 'computer') {
                playerText = currentPlayer === 'X' ? 'Your turn (X)' : 'Computer thinking... (O)';
            } else {
                playerText = `Player ${currentPlayer}`;
            }
            document.getElementById('currentPlayer').textContent = `Current: ${playerText}`;
        }

        function makeComputerMove() {
            if (!gameActive) return;

            isComputerTurn = true;


            document.getElementById('gameMessage').innerHTML =
                '<div class="computer-thinking">🤖 Computer is thinking...</div>';


            const bestMove = getBestMove();

            setTimeout(() => {
                if (bestMove && gameActive) {
                    const cellIndex = bestMove.row * 3 + bestMove.col;
                    const cellElement = document.querySelectorAll('.cell')[cellIndex];


                    document.getElementById('gameMessage').innerHTML = '';

                    // computer thinks
                    board[bestMove.row][bestMove.col] = 'O';
                    cellElement.textContent = 'O';
                    cellElement.classList.add('o');
                    cellElement.disabled = true;

                    // check for winner
                    if (checkWinner(board, 'O')) {
                        document.getElementById('gameMessage').innerHTML =
                            '<div class="winner-message">🤖 Computer wins!</div>';
                        gameActive = false;
                        disableAllCells();
                        isComputerTurn = false;
                        return;
                    }

                    // Check for draw
                    if (isDraw(board)) {
                        document.getElementById('gameMessage').innerHTML =
                            '<div class="draw-message">🤝 It\'s a draw!</div>';
                        gameActive = false;
                        isComputerTurn = false;
                        return;
                    }

                    currentPlayer = 'X';
                    updateCurrentPlayerDisplay();
                }
                isComputerTurn = false;
            }, 800);
        }

        function getBestMove() {

            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    if (board[i][j] === " ") {
                        board[i][j] = "O";
                        if (checkWinner(board, "O")) {
                            board[i][j] = " ";
                            return { row: i, col: j };
                        }
                        board[i][j] = " ";
                    }
                }
            }


            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    if (board[i][j] === " ") {
                        board[i][j] = "X";
                        if (checkWinner(board, "X")) {
                            board[i][j] = " ";
                            return { row: i, col: j };
                        }
                        board[i][j] = " ";
                    }
                }
            }


            if (board[1][1] === " ") {
                return { row: 1, col: 1 };
            }


            const corners = [{ row: 0, col: 0 }, { row: 0, col: 2 }, { row: 2, col: 0 }, { row: 2, col: 2 }];
            for (let corner of corners) {
                if (board[corner.row][corner.col] === " ") {
                    return corner;
                }
            }


            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    if (board[i][j] === " ") {
                        return { row: i, col: j };
                    }
                }
            }

            return null;
        }

        function checkWinner(board, player) {
            // check rows
            for (let i = 0; i < 3; i++) {
                if (board[i][0] === player && board[i][1] === player && board[i][2] === player) {
                    return true;
                }
            }

            // check columns
            for (let i = 0; i < 3; i++) {
                if (board[0][i] === player && board[1][i] === player && board[2][i] === player) {
                    return true;
                }
            }

            // check diagonals
            if (board[0][0] === player && board[1][1] === player && board[2][2] === player) {
                return true;
            }
            if (board[0][2] === player && board[1][1] === player && board[2][0] === player) {
                return true;
            }

            return false;
        }

        function isDraw(board) {

            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    if (board[i][j] === " ") {
                        return false;
                    }
                }
            }
            return true;
        }

        function disableAllCells() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => cell.disabled = true);
        }

        function resetGame() {
            board = [
                [" ", " ", " "],
                [" ", " ", " "],
                [" ", " ", " "]
            ];
            currentPlayer = "X";
            gameActive = true;
            isComputerTurn = false;

            updateCurrentPlayerDisplay();
            document.getElementById('gameMessage').innerHTML = '';

            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.textContent = '';
                cell.className = 'cell';
                cell.disabled = false;
            });
        }

        initializeBoard();
    </script>
</body>

</html>
